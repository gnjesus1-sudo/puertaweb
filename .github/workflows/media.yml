name: fetch-media
on:
  push:
    paths: ['_media/urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          i=1; while read -r u; do [ -z "$u" ] && continue; curl -sSfL "$u" -o "_media/voz$i.wav"; i=$((i+1)); done < _media/urls.txt
          git config user.name "media-bot"; git config user.email "media-bot@users.noreply.github.com"
          git add _media/*.wav && git commit -m "media" && git push
